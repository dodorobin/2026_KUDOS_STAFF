const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); const norm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
function roles(p){const a=[];p.schedule.forEach(x=>{if(!x.role||x.role.startsWith("휴식")||x.role.startsWith("총괄")||x.role==="국차장")return;if(!a.includes(x.role))a.push(x.role)});return a}
function img(file,x,y,w,h,cap){return `<div><div class="caption">${esc(cap)}</div><div class="loc" onclick="openModal(this)"><img src="${esc(file)}"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><circle class="pin" cx="${x}" cy="${y}" r="28"/></svg></div></div>`}
function block(role){const c=cfg[role];if(!c)return `<div class="role-title">${esc(role)}</div><div class="warn">아직 깨끗한 위치 사진 매칭이 확정되지 않았습니다.</div>`;let body=img(c.photo.file,c.photo.x,c.photo.y,c.photo.w,c.photo.h,"현장 사진");if(c.map)body=`<div class="pair">${img(c.map.file,c.map.x,c.map.y,c.map.w,c.map.h,"게이트 위치도")}${body}</div>`;return `<div class="role-title">${esc(role)}</div>${body}`}
function render(p){const rs=roles(p),loc=rs.length?rs.map(block).join(""):`<div class="warn">공통/총괄 역할은 특정 위치가 지정되지 않습니다.</div>`;const slots=p.schedule.map(s=>`<div class="slot zone-${esc(s.zone)}"><div class="time">${esc(s.time)}</div><div><span class="chip">${esc(s.role||"미배치")}</span>${s.desc?`<div class="detail">${esc(s.desc)}</div>`:""}</div></div>`).join("");document.getElementById("content").innerHTML=`<div class="card"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div><div class="card"><div class="section" style="margin-top:0">내 위치</div>${loc}</div><div class="section">시간대별 역할 · 위치</div><div class="schedule">${slots}</div>`;results.style.display="none";search.value=p.name}
const search=document.getElementById("search"),results=document.getElementById("results");function show(){const q=norm(search.value);if(!q){results.style.display="none";return}const m=staffData.filter(p=>norm(p.name).includes(q)).slice(0,12);results.innerHTML=m.length?m.map(p=>`<div class="result" data-i="${staffData.indexOf(p)}"><div class="rname">${esc(p.name)}</div><div class="rsub">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div>`).join(""):`<div class="result"><div class="rsub">검색 결과가 없습니다.</div></div>`;results.style.display="block"}
search.addEventListener("input",show);search.addEventListener("focus",show);results.addEventListener("click",e=>{const x=e.target.closest(".result[data-i]");if(x)render(staffData[+x.dataset.i])});search.addEventListener("keydown",e=>{if(e.key==="Enter"){const q=norm(search.value),p=staffData.find(x=>norm(x.name)===q)||staffData.find(x=>norm(x.name).includes(q));if(p)render(p)}})
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.panel).classList.add("active")}))
function openModal(el){document.getElementById("modalbody").innerHTML=el.outerHTML.replace('onclick="openModal(this)"',"");document.getElementById("modal").classList.add("open")}function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("modalbody").innerHTML=""}document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})
</script></body></html>

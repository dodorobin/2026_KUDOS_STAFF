<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b0029">
<title>2026 정기 고연전 주경기장 스태프 배치</title>
<style>
:root{
 --ku:#8b0029;--ku2:#61001d;--bg:#f5f6f8;--card:#fff;--text:#171717;--muted:#6b7280;--border:#e5e7eb;
 --n-bg:#f7c1c1;--n-text:#501313;--e-bg:#d6dfef;--e-text:#1f3864;--w-bg:#faeeda;--w-text:#633806;
 --common-bg:#e4dcf2;--common-text:#4a3a6b;--rest-bg:#ececec;--rest-text:#5a5a5a
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
header{background:linear-gradient(135deg,var(--ku),var(--ku2));color:#fff;padding:25px 18px 21px}
header .inner{max-width:1000px;margin:0 auto}h1{font-size:21px;line-height:1.35;margin:0 0 6px;font-weight:900}
.subtitle{font-size:13px;opacity:.84}.updated{font-size:11px;opacity:.68;margin-top:6px}
.shell{display:grid;grid-template-columns:150px minmax(0,820px);gap:18px;max-width:1030px;margin:0 auto;padding:18px 14px 48px}
.nav{position:sticky;top:14px;align-self:start;background:#fff;border:1px solid var(--border);border-radius:16px;padding:8px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;color:#4b5563}
.nav button.active{background:#fff2f6;color:var(--ku)}.panel{display:none}.panel.active{display:block}
.searchbox{position:relative}.searchbox input{width:100%;padding:15px 16px;border:1px solid var(--border);border-radius:14px;font-size:17px;background:#fff;outline:none}
#results{position:absolute;left:0;right:0;top:56px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.13);z-index:50;display:none;overflow:hidden}
.result{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}.result:last-child{border-bottom:0}.result:hover{background:#fafafa}
.rname{font-weight:850}.rsub,.guide{font-size:12px;color:var(--muted)}.guide{margin:9px 2px 14px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px 0}
.name{font-size:24px;font-weight:900}.meta{margin-top:6px;font-size:14px;color:var(--muted)}
.maphead{font-size:17px;font-weight:900}.mapsub{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
.rolechips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.rolechips span{font-size:12px;font-weight:800;padding:6px 9px;border-radius:9px;background:#fff2f2;color:#7f1d1d;border:1px solid #fecaca}
.section{font-size:15px;font-weight:900;margin:17px 2px 8px}
.map{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#111;cursor:zoom-in}
.map img{display:block;width:100%;height:auto}.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route{fill:none;stroke:#e60012;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.route2{fill:none;stroke:#ff304f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 7}
.start{fill:#12a766;stroke:#fff;stroke-width:3}
.dot{fill:#ef1b25;stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1s infinite ease-in-out}
.dot.second{fill:#ff5070}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.23;transform:scale(1.42)}}
.lbl{font-size:12px;font-weight:900;fill:#fff;paint-order:stroke;stroke:#7b0000;stroke-width:4;stroke-linejoin:round}
.startlbl{font-size:11px;font-weight:900;fill:#fff;paint-order:stroke;stroke:#086943;stroke-width:4}
.note{font-size:12px;color:#64748b;line-height:1.55;margin-top:8px}
.warn{font-size:12px;color:#7c3f00;background:#fff9e8;border-radius:10px;padding:9px 10px;margin-top:9px;line-height:1.5}
.schedule{display:flex;flex-direction:column;gap:9px}.slot{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 14px;display:grid;grid-template-columns:92px 1fr;gap:12px}
.time{font-size:13px;font-weight:850;padding-top:2px}.chip{display:inline-block;padding:5px 8px;border-radius:8px;font-size:14px;font-weight:850}
.detail{font-size:13px;color:#4b5563;margin-top:7px;line-height:1.5}
.zone-W .chip{background:var(--w-bg);color:var(--w-text)}.zone-E .chip{background:var(--e-bg);color:var(--e-text)}
.zone-N .chip{background:var(--n-bg);color:var(--n-text)}.zone-공통 .chip{background:var(--common-bg);color:var(--common-text)}
.zone-휴식 .chip{background:var(--rest-bg);color:var(--rest-text)}.zone-기타 .chip{background:#eef2f7;color:#374151}
.docs img{width:100%;border-radius:12px;border:1px solid var(--border)}.docslinks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.docslinks a{text-align:center;text-decoration:none;border-radius:11px;padding:12px;font-weight:850;border:1px solid var(--border)}
.docslinks .e{background:var(--e-bg);color:var(--e-text)}.docslinks .n{background:var(--n-bg);color:var(--n-text)}.docslinks .w{background:var(--w-bg);color:var(--w-text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}
.modalinner{width:min(1200px,100%);position:relative}.modalinner .map{border:0}.close{position:absolute;right:4px;top:-44px;width:38px;height:38px;border:0;border-radius:50%;font-size:20px;font-weight:900;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:42px 12px}
footer{text-align:center;color:#9ca3af;font-size:11px;padding:24px 0}
@media(max-width:700px){.shell{display:block;padding:14px 14px 44px}.nav{position:static;display:flex;gap:7px;margin-bottom:14px;padding:7px}.nav button{text-align:center}.slot{grid-template-columns:80px 1fr}.docslinks{grid-template-columns:1fr}.lbl{font-size:15px}}
</style>
</head>

  eentry:[[209,304],[199,319],[192,338],[158,331],[120,321],[64,296],[57,253],[40,211],[49,145],[78,101],[138,45],[215,30]]
};

/* Precise role dots on the clean W/E photos.
   W/E images are the clean photos supplied by the user. */
const roleMap={
 "1번 게이트 (귀빈) 및 중앙홀":{zone:"W",entry:"gate1",over:P.gate1,label:"1번 게이트"},
 "17번 게이트(관계자·플로어)":{zone:"W",entry:"gate17",over:P.gate17,label:"17번 게이트"},
 "18번 게이트 (교우·교직원·프레스)":{zone:"W",entry:"gate18",over:P.gate18,label:"18번 게이트"},
 "W구역 플로어 출입구":{zone:"W",entry:"wfloor",over:P.wfloor,detail:[943,754],map:"W",label:"W 플로어 출입구"},
 "W구역 VIP 쪽문 및 중앙 플로어 계단":{zone:"W",entry:"gate1",detail:[238,672],map:"W",label:"VIP 쪽문·중앙계단"},
 "W구역 중간 통로 및 터널(좌)":{zone:"W",entry:"gate18",detail:[330,576],map:"W",label:"중간 통로·터널(좌)"},
 "W구역 상단 경계지점 (방송부스 뒤)":{zone:"W",entry:"gate18",detail:[98,388],map:"W",label:"상단 경계"},
 "W구역 상단 통로(좌)":{zone:"W",entry:"gate18",detail:[814,423],map:"W",label:"상단 통로(좌)"},
 "W구역 상단 통로(우)":{zone:"W",entry:"gate18",detail:[1148,427],map:"W",label:"상단 통로(우)"},
 "W구역 중간 통로 및 터널(우)":{zone:"W",entry:"gate18",detail:[1034,546],map:"W",label:"중간 통로·터널(우)"},
 "W구역 N구역 경계 (상단)":{zone:"W",entry:"gate17",detail:[1327,577],map:"W",label:"W-N 경계"},

 "E9 및 터널":{zone:"E",entry:"eentry",detail:[721,400],map:"E",label:"E9 및 터널"},
 "E8":{zone:"E",entry:"eentry",detail:[964,397],map:"E",label:"E8"},
 "E7 및 터널":{zone:"E",entry:"eentry",detail:[1229,398],map:"E",label:"E7 및 터널"},
 "E19":{zone:"E",entry:"eentry",detail:[626,282],map:"E",label:"E19"},
 "E18":{zone:"E",entry:"eentry",detail:[874,282],map:"E",label:"E18"},
 "E17":{zone:"E",entry:"eentry",detail:[1098,278],map:"E",label:"E17"},
 "E10":{zone:"E",entry:"eentry",detail:[518,397],map:"E",label:"E10"},
 "E구역 N구역 경계 (상)":{zone:"E",entry:"eentry",detail:[389,363],map:"E",label:"E-N 경계(상)"},
 "E구역 N구역 경계 (하)":{zone:"E",entry:"eentry",detail:[381,413],map:"E",label:"E-N 경계(하)"},
 "고대 연대 경계 지점(상)":{zone:"E",entry:"eentry",detail:[1419,276],map:"E",label:"양교 경계(상)"},
 "고대 연대 경계 지점(중)":{zone:"E",entry:"eentry",detail:[1417,390],map:"E",label:"양교 경계(중)"},
 "고대 연대 경계 지점(하)":{zone:"E",entry:"eentry",detail:[1419,483],map:"E",label:"양교 경계(하)"}
};

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const norm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
function roles(p){const a=[];p.schedule.forEach(x=>{if(x.role&&!x.role.startsWith("휴식")&&!x.role.startsWith("총괄")&&x.role!=="국차장"&&!a.includes(x.role))a.push(x.role)});return a}
function mapped(p){return roles(p).filter(r=>roleMap[r]).slice(0,2)}
function poly(points,second=false){return `<polyline class="${second?'route2':'route'}" points="${points.map(x=>x.join(",")).join(" ")}"/>`}
function dot(pt,label,second=false){return `<circle class="dot ${second?'second':''}" cx="${pt[0]}" cy="${pt[1]}" r="8"/><text class="lbl" x="${pt[0]+11}" y="${pt[1]-9}">${esc(label)}</text>`}
function overview(p,forModal=false){
 const rs=mapped(p); let lines=[],dots=[];
 rs.forEach((r,i)=>{const m=roleMap[r]; if(ROUTES[m.entry])lines.push(poly(ROUTES[m.entry],i===1)); if(m.over)dots.push(dot(m.over,m.label,i===1));});
 return `<div class="map" ${forModal?'':'onclick="openModal(this)"'}><img src="${overviewImg}">
 <svg viewBox="0 0 ${OW} ${OH}" preserveAspectRatio="xMidYMid meet">
 ${lines.join("")}<circle class="start" cx="${P.meeting[0]}" cy="${P.meeting[1]}" r="7"/><text class="startlbl" x="${P.meeting[0]+9}" y="${P.meeting[1]-8}">회의실</text>${dots.join("")}
 </svg></div>`;
}
function detail(p,map,forModal=false){
 const rs=mapped(p).filter(r=>roleMap[r].map===map); if(!rs.length)return "";
 const img=map==="W"?wImg:eImg, W=map==="W"?WW:EW,H=map==="W"?WH:EH;
 return `<div class="map" ${forModal?'':'onclick="openModal(this)"'}><img src="${img}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${rs.map((r,i)=>dot(roleMap[r].detail,roleMap[r].label,i===1)).join("")}</svg></div>`;
}
function mapCard(p){
 const all=roles(p),rs=mapped(p),missing=all.filter(r=>!roleMap[r]);
 if(!rs.length)return `<div class="card"><div class="maphead">내 위치 · 권장 이동동선</div><div class="warn">현재 역할은 아직 지도 좌표가 등록되지 않았습니다. W/E구역부터 우선 적용 중입니다.</div></div>`;
 return `<div class="card"><div class="maphead">내 위치 · 권장 이동동선</div>
 <div class="mapsub">빨간 원이 역할 위치입니다. 역할이 2개면 2개가 깜빡입니다. 빨간 이동선은 기존 노란 동선만 따라가도록 재구성했습니다.</div>
 <div class="rolechips">${rs.map(r=>`<span>${esc(r)}</span>`).join("")}</div>
 <div class="section">회의실 → 배치구역</div>${overview(p)}
 ${detail(p,"W")?`<div class="section">W구역 세부 위치</div>${detail(p,"W")}`:""}
 ${detail(p,"E")?`<div class="section">E구역 세부 위치</div>${detail(p,"E")}<div class="note">※ E구역 관람석·경계 역할은 2층 위치이므로 1층 기본도면에 억지로 점을 찍지 않고, E구역 정면도에 정확한 위치를 표시합니다.</div>`:""}
 ${missing.length?`<div class="warn">아직 지도 미등록: ${missing.map(esc).join(" / ")}</div>`:""}
 </div>`;
}
function render(p){
 const slots=p.schedule.map(s=>`<div class="slot zone-${esc(s.zone)}"><div class="time">${esc(s.time)}</div><div><span class="chip">${esc(s.role||"미배치")}</span>${s.desc?`<div class="detail">${esc(s.desc)}</div>`:""}</div></div>`).join("");
 document.getElementById("content").innerHTML=`<div class="card"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div>${mapCard(p)}<div class="section">시간대별 역할 · 위치</div><div class="schedule">${slots}</div>`;
 document.getElementById("results").style.display="none";document.getElementById("search").value=p.name;
}
const search=document.getElementById("search"),results=document.getElementById("results");
function show(){const q=norm(search.value);if(!q){results.style.display="none";return}const m=staffData.filter(p=>norm(p.name).includes(q)).slice(0,12);results.innerHTML=m.length?m.map(p=>`<div class="result" data-i="${staffData.indexOf(p)}"><div class="rname">${esc(p.name)}</div><div class="rsub">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div>`).join(""):`<div class="result"><div class="rsub">검색 결과가 없습니다.</div></div>`;results.style.display="block"}
search.addEventListener("input",show);search.addEventListener("focus",show);results.addEventListener("click",e=>{const x=e.target.closest(".result[data-i]");if(x)render(staffData[+x.dataset.i])});
search.addEventListener("keydown",e=>{if(e.key==="Enter"){const q=norm(search.value),p=staffData.find(x=>norm(x.name)===q)||staffData.find(x=>norm(x.name).includes(q));if(p)render(p)}});

document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.panel).classList.add("active")}));
function openModal(el){document.getElementById("modalbody").innerHTML=el.outerHTML.replace('onclick="openModal(this)"',"");document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("modalbody").innerHTML=""}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
</script>
</body>
</html>

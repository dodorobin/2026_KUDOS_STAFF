.shell{display:grid;grid-template-columns:155px minmax(0,840px);gap:18px;max-width:1050px;margin:auto;padding:18px 14px 48px}

.pair{display:grid;grid-template-columns:.72fr 1.28fr;gap:10px;align-items:start} .warn{font-size:12px;color:#7c3f00;background:#fff8e5;padding:10px;border-radius:10px;line-height:1.5}

function individualRoles(p){const a=[];p.schedule.forEach(x=>{if(!x.role||x.role.startsWith("휴식")||x.role.startsWith("총괄")||x.role==="국차장")return;if(!a.includes(x.role))a.push(x.role)});return a}
function img(file,x,y,w,h,cap){return `<div><div class="caption">${esc(cap)}</div><div class="loc" onclick="openModal(this)"><img src="${esc(file)}"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><circle class="pin" cx="${x}" cy="${y}" r="34"/></svg></div></div>`}
function locationBlock(role,showTitle=true){const c=cfg[role]; const title=showTitle?`<div class="role-title">${esc(role)}</div>`:""; if(!c)return `${title}<div class="warn">이 역할은 특정 위치 사진이 등록되지 않았습니다.</div>`; const photo=img(c.photo.file,c.photo.x,c.photo.y,c.photo.w,c.photo.h,"실제 배치 사진"); if(c.map){const map=img(c.map.file,c.map.x,c.map.y,c.map.w,c.map.h,"게이트 위치도");return `${title}<div class="pair">${map}${photo}</div>`} return `${title}${photo}`}
function renderPerson(p){const rs=individualRoles(p),loc=rs.length?rs.map(r=>locationBlock(r,true)).join(""):`<div class="warn">공통/총괄 역할은 특정 위치가 지정되지 않습니다.</div>`;const slots=p.schedule.map(s=>`<div class="slot zone-${esc(s.zone)}"><div class="time">${esc(s.time)}</div><div><span class="chip">${esc(s.role||"미배치")}</span>${s.desc?`<div class="detail">${esc(s.desc)}</div>`:""}</div></div>`).join("");document.getElementById("content").innerHTML=`<div class="card"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div><div class="card"><div class="section" style="margin-top:0">내 위치</div>${loc}</div><div class="section">시간대별 역할 · 위치</div><div class="schedule">${slots}</div>`;results.style.display="none";search.value=p.name}
const search=document.getElementById("search"),results=document.getElementById("results");
function showSearch(){const q=norm(search.value);if(!q){results.style.display="none";return}const ms=staffData.filter(p=>norm(p.name).includes(q)).slice(0,12);results.innerHTML=ms.length?ms.map(p=>`<div class="result" data-i="${staffData.indexOf(p)}"><div class="rname">${esc(p.name)}</div><div class="rsub">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div>`).join(""):`<div class="result"><div class="rsub">검색 결과가 없습니다.</div></div>`;results.style.display="block"}
search.addEventListener("input",showSearch);search.addEventListener("focus",showSearch);results.addEventListener("click",e=>{const x=e.target.closest(".result[data-i]");if(x)renderPerson(staffData[+x.dataset.i])});search.addEventListener("keydown",e=>{if(e.key==="Enter"){const q=norm(search.value),p=staffData.find(x=>norm(x.name)===q)||staffData.find(x=>norm(x.name).includes(q));if(p)renderPerson(p)}});

function roleZone(role){
  for(const p of staffData){for(const s of p.schedule){if(s.role===role)return s.zone||"기타"}}
  return role.startsWith("총괄")||role==="국차장"?"공통":"기타";
}
function venueClass(venue){
  if(venue==="농구장") return "venue-basketball";
  if(venue==="빙구장") return "venue-hockey";
  if(venue==="야구장") return "venue-baseball";
  return "venue-common";
}
function koreanSort(a,b){
  return a.name.localeCompare(b.name,"ko-KR");
}
let openRole=null;

function buildRoleGroups(){
  const groups={"E":[],"W":[],"N":[],"공통":[],"기타":[]};
  roleOrder.forEach(r=>{const z=roleZone(r);(groups[z]||groups["기타"]).push(r)});
  const labels={E:"E구역",W:"W구역",N:"N구역","공통":"공통·총괄","기타":"기타"};
  const root=document.getElementById("roleGroups");
  root.innerHTML=Object.entries(groups).filter(([_,rs])=>rs.length).map(([z,rs])=>
    `<div class="role-group">
      <div class="role-group-title">${labels[z]}</div>
      <div class="role-list">${rs.map(r=>
        `<div class="role-row" data-role-row="${esc(r)}">
          <button class="role-btn" data-role="${esc(r)}">${esc(r)}</button>
          <div class="role-inline-holder"></div>
        </div>`).join("")}
      </div>
    </div>`).join("");
  root.querySelectorAll(".role-btn").forEach(btn=>btn.addEventListener("click",()=>toggleRole(btn.dataset.role,btn)));
}

function toggleRole(role,btn){
  const row=btn.closest(".role-row");
  const holder=row.querySelector(".role-inline-holder");

  if(openRole===role){
    btn.classList.remove("active");
    holder.innerHTML="";
    openRole=null;
    return;
  }

  document.querySelectorAll(".role-btn").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".role-inline-holder").forEach(x=>x.innerHTML="");openRole=null;
  document.querySelectorAll(".role-inline-holder").forEach(x=>x.innerHTML="");
  openRole=role;
  btn.classList.add("active");

  const times=[...new Set(staffData.flatMap(p=>p.schedule.map(s=>s.time)))];
  const slots=times.map(t=>{
    const assigned=staffData
      .filter(p=>p.schedule.some(s=>s.time===t&&s.role===role))
      .sort(koreanSort);
    const chips=assigned.length
      ? `<div class="role-people">${assigned.map(p=>
          `<span class="person-chip ${venueClass(p.venue)}">${esc(p.name)} <small>${esc(p.year)}학번</small></span>`
        ).join("")}</div>`
      : `<div class="none">배치 없음</div>`;
    return `<div class="role-time-slot"><div class="time">${esc(t)}</div><div>${chips}</div></div>`;
  }).join("");

  const desc=roleDescriptions[role]||"";
  holder.innerHTML=
    `<div class="role-inline">
      <div class="role-detail-name">${esc(role)}</div>
      ${desc?`<div class="role-detail-desc">${esc(desc)}</div>`:""}
      <div class="section">위치</div>
      ${locationBlock(role,false)}
      <div class="section">시간대별 배치 인원</div>
      ${slots}
    </div>`;
}
buildRoleGroups();

function switchPanel(id){document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.panel===id));document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("active",x.id===id));window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>switchPanel(b.dataset.panel)));
function goHome(){switchPanel("staffPanel");search.value="";results.style.display="none";document.getElementById("content").innerHTML='<div class="empty">이름을 검색해주세요.</div>';document.querySelectorAll(".role-btn").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".role-inline-holder").forEach(x=>x.innerHTML="");openRole=null}
function openModal(el){document.getElementById("modalbody").innerHTML=el.outerHTML.replace('onclick="openModal(this)"',"");document.getElementById("modal").classList.add("open")}function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("modalbody").innerHTML=""}document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
</script></body></html>

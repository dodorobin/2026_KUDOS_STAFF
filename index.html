const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const norm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();

function uniqueRoles(p){
 const a=[]; p.schedule.forEach(x=>{
  if(!x.role||x.role.startsWith("휴식")||x.role.startsWith("총괄")||x.role==="국차장") return;
  if(!a.includes(x.role)) a.push(x.role);
 }); return a;
}
function pinSvg(x,y,w,h){return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><circle class="pin" cx="${x}" cy="${y}" r="24"/></svg>`}
function locationImage(file,x,y,w,h,caption){
 return `<div><div class="loc-caption">${esc(caption)}</div><div class="loc-wrap" onclick="openModal(this)">
 <img src="${esc(file)}" alt="${esc(caption)}">${pinSvg(x,y,w,h)}</div></div>`;
}
function roleBlock(role){
 const c=roleCfg[role];
 if(!c) return `<div class="role-title">${esc(role)}</div><div class="warn">이 역할은 아직 위치 사진 매칭이 확정되지 않았습니다.</div>`;
 let inner="";
 if(c.gate && c.map){
   inner=`<div class="gate-pair">
   ${locationImage("gate-map.jpg",c.map.x,c.map.y,c.map.w,c.map.h,"게이트 위치도")}
   ${locationImage(c.photo.file,c.photo.x,c.photo.y,c.photo.w,c.photo.h,"현장 사진")}
   </div>`;
 } else {
   inner=locationImage(c.photo.file,c.photo.x,c.photo.y,c.photo.w,c.photo.h,"현장 사진");
 }
 return `<div class="role-title">${esc(role)}</div>${inner}`;
}
function render(p){
 const rs=uniqueRoles(p);
 const loc=rs.length?rs.map(roleBlock).join(""):`<div class="warn">공통/총괄 역할은 특정 위치가 지정되지 않습니다.</div>`;
 const slots=p.schedule.map(s=>`<div class="slot zone-${esc(s.zone)}"><div class="time">${esc(s.time)}</div><div><span class="chip">${esc(s.role||"미배치")}</span>${s.desc?`<div class="detail">${esc(s.desc)}</div>`:""}</div></div>`).join("");
 document.getElementById("content").innerHTML=`<div class="card"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div>
 <div class="card"><div class="section" style="margin-top:0">내 위치</div>${loc}</div>
 <div class="section">시간대별 역할 · 위치</div><div class="schedule">${slots}</div>`;
 document.getElementById("results").style.display="none"; document.getElementById("search").value=p.name;
}

 const q=norm(search.value); if(!q){results.style.display="none";return}
 const m=staffData.filter(p=>norm(p.name).includes(q)).slice(0,12);
 results.innerHTML=m.length?m.map(p=>`<div class="result" data-i="${staffData.indexOf(p)}"><div class="rname">${esc(p.name)}</div><div class="rsub">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div>`).join(""):`<div class="result"><div class="rsub">검색 결과가 없습니다.</div></div>`;
 results.style.display="block";
}
search.addEventListener("input",show);search.addEventListener("focus",show);
results.addEventListener("click",e=>{const x=e.target.closest(".result[data-i]");if(x)render(staffData[+x.dataset.i])});
search.addEventListener("keydown",e=>{if(e.key==="Enter"){const q=norm(search.value),p=staffData.find(x=>norm(x.name)===q)||staffData.find(x=>norm(x.name).includes(q));if(p)render(p)}});

document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");document.getElementById(b.dataset.panel).classList.add("active");
}));
function openModal(el){document.getElementById("modalbody").innerHTML=el.outerHTML.replace('onclick="openModal(this)"',"");document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("modalbody").innerHTML=""}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
</script>
</body></html>

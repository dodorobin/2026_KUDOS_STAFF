<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b0029">
<title>2026 정기 고연전 주경기장 스태프 배치</title>
<style>
:root{
  --ku:#8b0029; --ku-dark:#61001d; --bg:#f5f6f8; --card:#fff; --text:#171717;
  --muted:#6b7280; --border:#e5e7eb;
  --n-bg:#f7c1c1; --n-text:#501313;
  --e-bg:#d6dfef; --e-text:#1f3864;
  --w-bg:#faeeda; --w-text:#633806;
  --common-bg:#e4dcf2; --common-text:#4a3a6b;
  --rest-bg:#ececec; --rest-text:#5a5a5a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
header{background:linear-gradient(135deg,var(--ku),var(--ku-dark));color:#fff;padding:25px 18px 21px}
header .inner{max-width:980px;margin:0 auto}
h1{font-size:21px;line-height:1.35;margin:0 0 6px;font-weight:850}
.subtitle{font-size:13px;opacity:.84}
.updated{font-size:11px;opacity:.68;margin-top:6px}

.app-shell{display:grid;grid-template-columns:150px minmax(0,800px);gap:18px;max-width:1000px;margin:0 auto;padding:18px 14px 48px}
.side-nav{position:sticky;top:14px;align-self:start;background:#fff;border:1px solid var(--border);border-radius:16px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
.side-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;color:#4b5563}
.side-btn.active{background:#fff2f6;color:var(--ku)}
.panel{display:none}.panel.active{display:block}

.search-wrap{position:relative}
#search{width:100%;padding:15px 16px;border:1px solid var(--border);border-radius:14px;font-size:17px;background:#fff;outline:none;box-shadow:0 4px 18px rgba(0,0,0,.05)}
#search:focus{border-color:var(--ku);box-shadow:0 0 0 3px rgba(139,0,41,.10)}
#results{position:absolute;left:0;right:0;top:56px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.12);overflow:hidden;z-index:50;display:none}
.result-item{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer}.result-item:last-child{border-bottom:none}.result-item:hover{background:#fafafa}
.result-name{font-weight:800}.result-sub{font-size:12px;color:var(--muted);margin-top:3px}
.guide{font-size:13px;color:var(--muted);margin:10px 2px 14px}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}.legend span{font-size:11px;font-weight:750;padding:5px 8px;border-radius:999px}

.person-card,.map-card,.docs-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:17px;margin:12px 0}
.person-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.person-name{font-size:24px;font-weight:900;letter-spacing:-.4px}.badge{font-size:12px;font-weight:800;background:#f3f4f6;border-radius:999px;padding:6px 9px;white-space:nowrap}
.meta{margin-top:7px;color:var(--muted);font-size:14px}
.section-title{font-size:15px;font-weight:850;margin:18px 2px 9px}
.map-title{font-size:17px;font-weight:900}.map-sub{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
.map-wrap{position:relative;margin-top:12px;border-radius:14px;overflow:hidden;background:#101418;cursor:zoom-in;border:1px solid var(--border)}
.map-wrap img{display:block;width:100%;height:auto}
.map-wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map-caption{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.map-label{font-size:13px;font-weight:850;fill:#fff;paint-order:stroke;stroke:#b40000;stroke-width:4px;stroke-linejoin:round}
.route{fill:none;stroke:#00d0ff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.route.alt{stroke:#7c3aed}
.start-dot{fill:#14b86e;stroke:#fff;stroke-width:4}
.role-dot{fill:#ed1c24;stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:pulse 1.05s infinite ease-in-out}
.role-dot.alt{fill:#ff2e63}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(1.38)}}
.map-chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.map-chip{padding:6px 9px;border-radius:9px;background:#fff2f2;color:#7f1d1d;border:1px solid #fecaca;font-size:12px;font-weight:800}
.map-unmapped{margin-top:9px;padding:9px 10px;border-radius:10px;background:#f8fafc;color:#64748b;font-size:12px;line-height:1.5}

.schedule{display:flex;flex-direction:column;gap:9px}.slot{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 14px;display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:flex-start}
.slot.current{outline:3px solid rgba(139,0,41,.14);border-color:var(--ku)}.time{font-size:13px;font-weight:850;color:#374151;padding-top:2px}
.role-chip{display:inline-block;padding:5px 8px;border-radius:8px;font-weight:850;font-size:14px;line-height:1.35}
.role-detail{font-size:13px;color:#4b5563;margin-top:7px;line-height:1.5}.role-note{font-size:12px;color:#7c3f00;margin-top:5px;line-height:1.45}
.zone-N .role-chip{background:var(--n-bg);color:var(--n-text)}.zone-E .role-chip{background:var(--e-bg);color:var(--e-text)}
.zone-W .role-chip{background:var(--w-bg);color:var(--w-text)}.zone-공통 .role-chip{background:var(--common-bg);color:var(--common-text)}
.zone-휴식 .role-chip{background:var(--rest-bg);color:var(--rest-text)}.zone-기타 .role-chip{background:#eef2f7;color:#374151}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
footer{text-align:center;color:#9ca3af;font-size:11px;padding-top:24px}

.docs-title{font-size:20px;font-weight:900;margin-bottom:5px}.docs-sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:13px}
.stadium-map{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--border)}
.direct-links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 8px}
.pdf-tab-link{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:13px 10px;font-size:14px;font-weight:850;border:1px solid var(--border);cursor:pointer}
.pdf-tab-link.e{background:var(--e-bg);color:var(--e-text)}.pdf-tab-link.n{background:var(--n-bg);color:var(--n-text)}.pdf-tab-link.w{background:var(--w-bg);color:var(--w-text)}
.docs-hint{font-size:12px;color:var(--muted);line-height:1.5}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}.modal-inner{max-width:1180px;width:100%;position:relative}.modal img{width:100%;height:auto;display:block;border-radius:10px}
.modal svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.modal-close{position:absolute;right:6px;top:-45px;border:0;background:#fff;color:#111;border-radius:999px;width:38px;height:38px;font-size:20px;cursor:pointer;font-weight:900}

@media(max-width:700px){
  .app-shell{display:block;padding:14px 14px 48px}.side-nav{position:static;display:flex;gap:7px;margin-bottom:14px;padding:7px}.side-btn{text-align:center}
  .slot{grid-template-columns:80px 1fr;padding:12px}.time{font-size:12px}.direct-links{grid-template-columns:1fr}
  .person-card,.map-card,.docs-card{padding:14px}.map-label{font-size:18px}
}
</style>
</head>

<header><div class="inner">
  <h1>2026 정기 고연전<br>주경기장 스태프 배치</h1>
  <div class="subtitle">이름을 검색하면 개인 위치 · 이동 동선 · 시간대별 역할을 확인할 수 있습니다.</div>
  <div class="updated">최종 업데이트: 2026.09.26 01:53</div>

<div class="app-shell">

  <main>

        <div id="results"></div>

      <div class="guide">본인 이름을 입력한 뒤 검색 결과를 선택해주세요.</div>
      <div class="legend">
        <span style="background:var(--n-bg);color:var(--n-text)">N구역</span>
        <span style="background:var(--e-bg);color:var(--e-text)">E구역</span>
        <span style="background:var(--w-bg);color:var(--w-text)">W구역</span>
        <span style="background:var(--common-bg);color:var(--common-text)">공통/총괄</span>
        <span style="background:var(--rest-bg);color:var(--rest-text)">휴식·대기</span>
      </div>
      <div id="content"><div class="empty">이름을 검색해주세요.</div></div>
    </section>

    <section id="docsPanel" class="panel">
      <div class="docs-card">
        <div class="docs-title">도면 · 배치도 · 사전교육자료</div>
        <div class="docs-sub">기본도면과 구역별 배치자료를 확인할 수 있습니다.</div>
        <img class="stadium-map" src="stadium-map.png" alt="목동종합운동장 기본도면">
        <div class="direct-links">
          <button class="pdf-tab-link e" onclick="openEmbeddedPdf('E')">E구역 자료</button>
          <button class="pdf-tab-link n" onclick="openEmbeddedPdf('N')">N구역 자료</button>
          <button class="pdf-tab-link w" onclick="openEmbeddedPdf('W')">W구역 자료</button>
        </div>
        <div class="docs-hint">버튼을 누르면 해당 PDF가 새 창에서 열립니다.</div>
      </div>
    </section>

    <footer>고려대학교 체육국 · 현장 상황에 따라 배치는 변경될 수 있습니다.</footer>
  </main>
</div>

<div id="mapModal" class="modal" aria-hidden="true">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeMapModal()">×</button>
    <div id="modalMap"></div>
  </div>
</div>

const overviewRoutes = {
  gate1: [[525,710],[610,730],[646,785]],
  gate17:[[525,710],[484,792]],
  gate18:[[525,710],[484,792],[310,750]],
  wfloor:[[525,710],[454,690]],
  eentry:[[525,710],[484,792],[310,750],[175,690],[160,586],[118,484],[140,326],[210,220],[355,85],[540,48]]
};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function normalize(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
function currentSlotIndex(){
  const d=new Date(), now=d.getHours()*60+d.getMinutes(), starts=[540,600,660,720,780,840,900,960];
  for(let i=0;i<starts.length;i++) if(now>=starts[i] && now<starts[i]+60) return i;
  return -1;
}
function uniqueRoles(p){
  const out=[];
  p.schedule.forEach(s=>{
    if(!s.role || s.role.startsWith("휴식") || s.role.startsWith("총괄") || s.role==="국차장") return;
    if(!out.includes(s.role)) out.push(s.role);
  });
  return out;
}
function mappedRoles(p){return uniqueRoles(p).filter(r=>roleMap[r]).slice(0,2)}
function svgPolyline(points, alt=false){return `<polyline class="route ${alt?'alt':''}" points="${points.map(p=>p.join(',')).join(' ')}"></polyline>`}
function svgDot(x,y,label,alt=false){
  return `<circle class="role-dot ${alt?'alt':''}" cx="${x}" cy="${y}" r="13"></circle>
          <text class="map-label" x="${x+18}" y="${y-13}">${esc(label)}</text>`;
}
function overviewMapHtml(p, modal=false){
  const roles=mappedRoles(p);
  const work=roles.map(r=>({role:r,...roleMap[r]}));
  const routes=[];
  const dots=[];
  work.forEach((m,i)=>{
    const rp=overviewRoutes[m.route];
    if(rp) routes.push(svgPolyline(rp,i===1));
    const pt=m.overview || (m.route==="eentry" ? [540,48] : null);
    if(pt) dots.push(svgDot(pt[0],pt[1],m.label,i===1));
  });
  const svg=`<svg viewBox="0 0 ${MAP_W} ${MAP_H}" preserveAspectRatio="xMidYMid meet">
    ${routes.join('')}
    <circle class="start-dot" cx="525" cy="710" r="12"></circle>
    <text class="map-label" x="544" y="697">휴게공간(회의실)</text>
    ${dots.join('')}
  </svg>`;
  return `<div class="map-wrap" ${modal?'':'onclick="openMapModal(this)"'} data-maptype="overview">
    <img src="${overviewImg}" alt="전체 이동 동선">${svg}
  </div>`;
}
function detailMapHtml(p, mapType, modal=false){
  const roles=mappedRoles(p).filter(r=>roleMap[r].detailMap===mapType);
  if(!roles.length) return '';
  const img=mapType==="W"?wMapImg:eMapImg;
  const dots=roles.map((r,i)=>{
    const m=roleMap[r],pt=m.detail; return svgDot(pt[0],pt[1],m.label,i===1);
  }).join('');
  const svg=`<svg viewBox="0 0 ${DETAIL_W} ${DETAIL_H}" preserveAspectRatio="xMidYMid meet">${dots}</svg>`;
  return `<div class="map-wrap" ${modal?'':'onclick="openMapModal(this)"'} data-maptype="${mapType}">
    <img src="${img}" alt="${mapType}구역 세부 위치">${svg}
  </div>`;
}
function mapCardHtml(p){
  const roles=uniqueRoles(p), mapped=mappedRoles(p), unmapped=roles.filter(r=>!roleMap[r]);
  if(!mapped.length){
    return `<div class="map-card">
      <div class="map-title">내 위치 · 이동 동선</div>
      <div class="map-unmapped">현재 역할은 아직 지도 좌표가 등록되지 않았습니다. W·E구역부터 우선 적용 중입니다.</div>
    </div>`;
  }
  const chips=mapped.map(r=>`<span class="map-chip">${esc(r)}</span>`).join('');
  const wDetail=detailMapHtml(p,"W"), eDetail=detailMapHtml(p,"E");
  const unmappedHtml=unmapped.length?`<div class="map-unmapped">아직 지도 미등록: ${unmapped.map(esc).join(' / ')}</div>`:'';
  const eNote=mapped.some(r=>roleMap[r].zone==="E")
    ? `<div class="map-caption">※ E구역 이동 동선은 현재 임시 안내자료의 외부 연결선을 기준으로 우선 표시했습니다. 세부 연결은 추후 보완 가능합니다.</div>`:'';
  return `<div class="map-card">
    <div class="map-title">내 위치 · 이동 동선</div>
    <div class="map-sub">빨간 점이 본인 역할 위치입니다. 역할이 1개면 1개, 2개면 2개가 깜빡이며 표시됩니다. 지도를 누르면 크게 볼 수 있습니다.</div>
    <div class="map-chip-row">${chips}</div>
    <div class="section-title">회의실 → 배치구역 이동 동선</div>
    ${overviewMapHtml(p)}
    ${eNote}
    ${wDetail?`<div class="section-title">W구역 세부 위치</div>${wDetail}`:''}
    ${eDetail?`<div class="section-title">E구역 세부 위치</div>${eDetail}`:''}
    ${unmappedHtml}
  </div>`;
}
function renderPerson(p){
  const current=currentSlotIndex();
  const slots=p.schedule.map((s,i)=>{
    const details=s.desc?`<div class="role-detail">${esc(s.desc)}</div>`:'';
    const note=s.note?`<div class="role-note">※ ${esc(s.note)}</div>`:'';
    return `<div class="slot zone-${esc(s.zone)} ${i===current?'current':''}">
      <div class="time">${esc(s.time)}</div><div><span class="role-chip">${esc(s.role||'미배치')}</span>${details}${note}</div>
    </div>`;
  }).join('');
  content.innerHTML=`
    <div class="person-card">
      <div class="person-title"><div>
        <div class="person-name">${esc(p.name)}</div>
        <div class="meta">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div>
      </div><div class="badge">${esc(p.group)}조</div></div>
    </div>
    ${mapCardHtml(p)}
    <div class="section-title">시간대별 역할 · 위치</div>
    <div class="schedule">${slots}</div>`;
  results.style.display='none'; search.value=p.name;
}
const search=document.getElementById('search'),results=document.getElementById('results'),content=document.getElementById('content');
function showResults(){
  const q=normalize(search.value); if(!q){results.style.display='none';return}
  const matched=staffData.filter(p=>normalize(p.name).includes(q)).slice(0,12);
  if(!matched.length){results.innerHTML='<div class="result-item"><div class="result-sub">검색 결과가 없습니다.</div></div>';results.style.display='block';return}
  results.innerHTML=matched.map(p=>`<div class="result-item" data-i="${staffData.indexOf(p)}"><div class="result-name">${esc(p.name)}</div><div class="result-sub">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div></div>`).join('');
  results.style.display='block';
}
search.addEventListener('input',showResults);search.addEventListener('focus',showResults);
results.addEventListener('click',e=>{const item=e.target.closest('.result-item[data-i]');if(item)renderPerson(staffData[Number(item.dataset.i)])});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=normalize(search.value),x=staffData.find(p=>normalize(p.name)===q)||staffData.find(p=>normalize(p.name).includes(q));if(x)renderPerson(x)}});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))results.style.display='none'});

function openMapModal(el){

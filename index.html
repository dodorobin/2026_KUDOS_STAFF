<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b0029">
<title>2026 정기 고연전 주경기장 스태프 배치</title>
<style>
:root {
  --ku:#8b0029;
  --ku-dark:#61001d;
  --bg:#f6f7f9;
  --card:#ffffff;
  --text:#171717;
  --muted:#6b7280;
  --border:#e5e7eb;
  --n-bg:#f7c1c1; --n-text:#501313;
  --e-bg:#d6dfef; --e-text:#1f3864;
  --w-bg:#faeeda; --w-text:#633806;
  --common-bg:#e4dcf2; --common-text:#4a3a6b;
  --rest-bg:#ececec; --rest-text:#5a5a5a;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
}
header{
  background:linear-gradient(135deg,var(--ku),var(--ku-dark));
  color:#fff; padding:28px 18px 24px;
}
header .inner,.container{max-width:760px;margin:0 auto}
h1{font-size:22px;line-height:1.35;margin:0 0 6px;font-weight:800}
.subtitle{font-size:13px;opacity:.82}
.container{padding:18px 14px 48px}
.search-wrap{position:relative;margin-top:-2px}
#search{
  width:100%;padding:15px 16px;border:1px solid var(--border);border-radius:14px;
  font-size:17px;background:white;outline:none;box-shadow:0 4px 18px rgba(0,0,0,.05);
}
#search:focus{border-color:var(--ku);box-shadow:0 0 0 3px rgba(139,0,41,.10)}
#results{
  position:absolute;left:0;right:0;top:56px;background:white;border:1px solid var(--border);
  border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.12);overflow:hidden;z-index:20;display:none;
}
.result-item{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:#fafafa}
.result-name{font-weight:750}
.result-sub{font-size:12px;color:var(--muted);margin-top:3px}
.guide{font-size:13px;color:var(--muted);margin:10px 2px 18px}
.person-card{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;margin:14px 0}
.person-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.person-name{font-size:24px;font-weight:850;letter-spacing:-.4px}
.badge{font-size:12px;font-weight:700;background:#f3f4f6;border-radius:999px;padding:6px 9px;white-space:nowrap}
.meta{margin-top:7px;color:var(--muted);font-size:14px}
.now-box{margin-top:14px;padding:13px 14px;border-radius:12px;background:#fff8fa;border:1px solid #f2cbd7}
.now-label{font-size:12px;color:var(--ku);font-weight:800;margin-bottom:4px}
.now-role{font-size:16px;font-weight:800}
.section-title{font-size:15px;font-weight:800;margin:20px 2px 10px}
.schedule{display:flex;flex-direction:column;gap:9px}
.slot{
  background:white;border:1px solid var(--border);border-radius:14px;padding:13px 14px;
  display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:flex-start;
}
.slot.current{outline:3px solid rgba(139,0,41,.15);border-color:var(--ku)}
.time{font-size:13px;font-weight:800;color:#374151;padding-top:2px}
.role-chip{display:inline-block;padding:5px 8px;border-radius:8px;font-weight:800;font-size:14px;line-height:1.35}
.role-detail{font-size:13px;color:#4b5563;margin-top:7px;line-height:1.5}
.role-note{font-size:12px;color:#7c3f00;margin-top:5px;line-height:1.45}
.zone-N .role-chip{background:var(--n-bg);color:var(--n-text)}
.zone-E .role-chip{background:var(--e-bg);color:var(--e-text)}
.zone-W .role-chip{background:var(--w-bg);color:var(--w-text)}
.zone-공통 .role-chip{background:var(--common-bg);color:var(--common-text)}
.zone-휴식 .role-chip{background:var(--rest-bg);color:var(--rest-text)}
.zone-기타 .role-chip{background:#eef2f7;color:#374151}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.legend span{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px}
footer{text-align:center;color:#9ca3af;font-size:11px;padding-top:24px}
@media(max-width:480px){
  header{padding-top:24px}
  h1{font-size:20px}
  .slot{grid-template-columns:80px 1fr;padding:12px}
  .time{font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>2026 정기 고연전<br>주경기장 스태프 배치</h1>
    <div class="subtitle">이름을 검색하면 시간대별 역할과 위치를 확인할 수 있습니다.</div>
  </div>
</header>

<main class="container">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="이름 검색 (예: 김도현)" autocomplete="off" />
    <div id="results"></div>
  </div>
  <div class="guide">본인 이름을 입력한 뒤 검색 결과를 선택해주세요.</div>

  <div class="legend">
    <span style="background:var(--n-bg);color:var(--n-text)">N구역</span>
    <span style="background:var(--e-bg);color:var(--e-text)">E구역</span>
    <span style="background:var(--w-bg);color:var(--w-text)">W구역</span>
    <span style="background:var(--common-bg);color:var(--common-text)">공통/총괄</span>
    <span style="background:var(--rest-bg);color:var(--rest-text)">휴식·대기</span>
  </div>

  <section id="content">
    <div class="empty">이름을 검색해주세요.</div>
  </section>

  <footer>고려대학교 체육국 · 현장 상황에 따라 배치는 변경될 수 있습니다.</footer>
</main>

const search = document.getElementById('search');
const results = document.getElementById('results');
const content = document.getElementById('content');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
}

function normalize(s) {
  return String(s || '').replace(/\s+/g,'').toLowerCase();
}

function timeToMinutes(hm) {
  const [h,m] = hm.split(':').map(Number);
  return h*60+m;
}

function currentSlotIndex() {
  const d = new Date();
  const now = d.getHours()*60+d.getMinutes();
  const starts = [540,600,660,720,780,840,900,960];
  for (let i=0;i<starts.length;i++) {
    if (now >= starts[i] && now < starts[i]+60) return i;
  }
  return -1;
}

function renderPerson(p) {
  const current = currentSlotIndex();
  let nowHtml = '';
  if (current >= 0 && p.schedule[current]) {
    const s = p.schedule[current];
    nowHtml = `<div class="now-box">
      <div class="now-label">현재 시간 배치</div>
      <div class="now-role">${esc(s.time)} · ${esc(s.role || '미배치')}</div>
    </div>`;
  }

  const slots = p.schedule.map((s,i) => {
    const cls = `slot zone-${esc(s.zone)} ${i===current?'current':''}`;
    const details = s.desc ? `<div class="role-detail">${esc(s.desc)}</div>` : '';
    const note = s.note ? `<div class="role-note">※ ${esc(s.note)}</div>` : '';
    const role = s.role || '미배치';
    return `<div class="${cls}">
      <div class="time">${esc(s.time)}</div>
      <div>
        <span class="role-chip">${esc(role)}</span>
        ${details}
        ${note}
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="person-card">
      <div class="person-title">
        <div>
          <div class="person-name">${esc(p.name)}</div>
          <div class="meta">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조${p.grade ? ' · '+esc(p.grade) : ''}</div>
        </div>
        <div class="badge">${esc(p.group)}조</div>
      </div>
      ${nowHtml}
    </div>
    <div class="section-title">시간대별 역할 · 위치</div>
    <div class="schedule">${slots}</div>
  `;
  results.style.display='none';
  search.value = p.name;
}

function showResults() {
  const q = normalize(search.value);
  if (!q) {
    results.style.display='none';
    return;
  }
  const matched = staffData.filter(p => normalize(p.name).includes(q)).slice(0,12);
  if (!matched.length) {
    results.innerHTML = `<div class="result-item"><div class="result-sub">검색 결과가 없습니다.</div></div>`;
    results.style.display='block';
    return;
  }
  results.innerHTML = matched.map((p,i) => `
    <div class="result-item" data-i="${staffData.indexOf(p)}">
      <div class="result-name">${esc(p.name)}</div>
      <div class="result-sub">${esc(p.year)}학번 · ${esc(p.venue)} · ${esc(p.group)}조</div>
    </div>`).join('');
  results.style.display='block';
}

search.addEventListener('input', showResults);
search.addEventListener('focus', showResults);
results.addEventListener('click', e => {
  const item = e.target.closest('.result-item[data-i]');
  if (!item) return;
  renderPerson(staffData[Number(item.dataset.i)]);
});
search.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = normalize(search.value);
    const exact = staffData.find(p => normalize(p.name) === q);
    const first = staffData.find(p => normalize(p.name).includes(q));
    if (exact || first) renderPerson(exact || first);
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) results.style.display='none';
});
</script>
